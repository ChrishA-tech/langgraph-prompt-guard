name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Evaluation (dev set; deepset if cached)
        run: if [ -f data/deepset_prompt_injections.json ]; then python -m promptguard.evaluate; else python -m promptguard.evaluate --datasets dev; fi
